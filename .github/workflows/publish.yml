name: Publish

on:
  workflow_run:
    workflows: ["Release Please"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or SHA) to publish"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Check release was created
        id: check
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v|^opencode-llm-proxy-v' | head -1)
          if [ -z "$TAG" ]; then
            echo "No release tag on this commit, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supports trusted publishing
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs >= 11.5.1)`)
              process.exit(1)
            }
          ' "$(npm --version)"

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Audit dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm audit

      - name: Check package contents
        if: steps.check.outputs.skip == 'false'
        run: npm pack --dry-run

      # Authenticates through npm trusted publishing (OIDC, `id-token: write`); no npm token is used.
      # Provenance is generated automatically.
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
